# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ja-JP
reviews:
  profile: assertive # takt 本体と同じ。細かい指摘も出す
  auto_review:
    base_branches: [".*"] # 向き先が main 以外の PR（takt のブランチの上に積んだ PR など）もレビューする
  auto_approvals:
    enabled: true # 指摘があれば Changes requested、解決して最新コミットのレビューが済めば Approved を出す。レビューが終わったかを PR の見出しで分かるようにするため
