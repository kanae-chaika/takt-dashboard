<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>TAKT ダッシュボード</title>
<link rel="stylesheet" href="app.css"></head>
<body>
<header><h1><a href="/" title="最新の run に戻る"><img src="/takt-logo.svg" alt="TAKT" class="logo" onerror="this.replaceWith('TAKT')"> ダッシュボード</a></h1><select id="runsel" aria-label="表示する run" onchange="selectRun(this.value)"></select><span class="muted" id="upd" style="margin-left:auto"></span></header>
<main id="app"></main>
<dialog id="viewer" aria-labelledby="vtitle"><div class="box"><div class="head"><span id="vtitle"></span><button type="button" onclick="closeViewer()" title="閉じる" aria-label="閉じる">×</button></div><pre id="vbody" tabindex="0" role="region" aria-labelledby="vtitle"></pre></div></dialog>
<script src="app.js"></script></body></html>
